name: Build Availability JSON

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WEBAPP_URL: "https://script.google.com/macros/s/AKfycbz3dMJtYEYxPmoZmuacrM5dBGZ9Jbh5rW3OFtOQDXYyt2RRW41z41HQ4mui5EVzKJyQ/exec"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch season window
        id: season
        run: |
          echo "🔎 Fetching season window..."

          for i in {1..5}; do
            RAW=$(curl -sSL "$WEBAPP_URL?mode=season_window") && break
            echo "Retry $i..."
            sleep $((i * 2))
          done

          CLEAN=$(echo "$RAW" | sed -n 's/.*<pre>\(.*\)<\/pre>.*/\1/p')
          if [ -z "$CLEAN" ]; then CLEAN="$RAW"; fi

          if ! echo "$CLEAN" | jq empty >/dev/null 2>&1; then
            echo "❌ Season window JSON invalid"
            exit 1
          fi

          START=$(echo "$CLEAN" | jq -r '.season_start')
          END=$(echo "$CLEAN" | jq -r '.season_end')

          START=$(date -d "$START" +%Y-%m-%d)
          END=$(date -d "$END" +%Y-%m-%d)

          echo "season_start=$START" >> $GITHUB_OUTPUT
          echo "season_end=$END" >> $GITHUB_OUTPUT

      - name: Build availability + day/week/month JSON
        run: |
          START="${{ steps.season.outputs.season_start }}"
          END="${{ steps.season.outputs.season_end }}"

          echo "📁 Creating production directories..."
          mkdir -p data/day data/week data/month

          echo "🔎 Fetching fields + complexes..."

          for i in {1..5}; do
            FIELDS_RAW=$(curl -sSL "$WEBAPP_URL?mode=fields") && break
            echo "Retry $i..."
            sleep $((i * 2))
          done

          FIELDS_CLEAN=$(echo "$FIELDS_RAW" | sed -n 's/.*<pre>\(.*\)<\/pre>.*/\1/p')
          if [ -z "$FIELDS_CLEAN" ]; then FIELDS_CLEAN="$FIELDS_RAW"; fi

          if ! echo "$FIELDS_CLEAN" | jq empty >/dev/null 2>&1; then
            echo "❌ Fields JSON invalid"
            exit 1
          fi

          CURRENT="$START"

          echo "🚀 Starting day-by-day build..."

          while [ "$(date -d "$CURRENT" +%Y-%m-%d)" != "$(date -d "$END + 1 day" +%Y-%m-%d)" ]; do
            echo "----------------------------------------"
            echo "📅 Processing date: $CURRENT"

            for i in {1..5}; do
              RAW_DAY=$(curl -sSL "$WEBAPP_URL?mode=day_calendar&date=$CURRENT") && break
              echo "Retry $i..."
              sleep $((i * 2))
            done

            CLEAN_DAY=$(echo "$RAW_DAY" | sed -n 's/.*<pre>\(.*\)<\/pre>.*/\1/p')
            if [ -z "$CLEAN_DAY" ]; then CLEAN_DAY="$RAW_DAY"; fi

            if ! echo "$CLEAN_DAY" | jq empty >/dev/null 2>&1; then
              echo "❌ Bad JSON for $CURRENT"
              exit 1
            fi

            # Normalize per-day JSON to what calendar.js expects
            DAY_WITH_META=$(jq -n \
              --argjson day "$CLEAN_DAY" \
              --argjson fields "$FIELDS_CLEAN" \
              '{
                date: $day.date,
                complexes: $fields.complexes,
                fields: $fields.fields,
                complex_timeline: $day.complex_timeline
              }'
            )

            echo "$DAY_WITH_META" > "data/day/${CURRENT}.json"
            echo "📝 Saved normalized day JSON → data/day/${CURRENT}.json"

            CURRENT=$(date -d "$CURRENT + 1 day" +%Y-%m-%d)
          done

          echo "📦 Building weeks.json..."
          WEEKS_JSON=$(jq -s '
            reduce .[] as $d ({}; 
              .[(($d.date | strptime("%Y-%m-%d") | mktime | strftime("%Y-%m-%d")))] 
              |= (. // {}) | .[$d.date] = $d
            )
          ' data/day/*.json)

          echo "$WEEKS_JSON" > data/week/weeks.json

          echo "📦 Building months.json..."
          MONTHS_JSON=$(jq -s '
            reduce .[] as $d ({}; 
              .[($d.date | strptime("%Y-%m-%d") | mktime | strftime("%Y-%m"))] 
              |= (. // {}) | .[$d.date] = $d
            )
          ' data/day/*.json)

          echo "$MONTHS_JSON" > data/month/months.json

          echo "🧩 Assembling final availability.json..."
          FINAL_JSON=$(jq -n \
            --arg start "$START" \
            --arg end "$END" \
            --argjson fields "$FIELDS_CLEAN" \
            --argjson days "$(jq -s 'reduce .[] as $d ({}; .[$d.date] = $d)' data/day/*.json)" \
            --argjson weeks "$WEEKS_JSON" \
            --argjson months "$MONTHS_JSON" \
            '{
              season_start: $start,
              season_end: $end,
              fields: $fields.fields,
              complexes: $fields.complexes,
              days: $days,
              weeks: $weeks,
              months: $months
            }'
          )

          echo "$FINAL_JSON" > data/availability.json
          echo "✅ Final JSON files written."

      - name: Commit updated JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          echo "📤 Committing changes..."
          git add data
          git commit -m "Updated availability JSON" || echo "No changes"
          git push
          echo "🚀 Push complete."
