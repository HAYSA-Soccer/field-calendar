name: Build Availability JSON

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WEBAPP_URL: "https://script.google.com/macros/s/AKfycbz3dMJtYEYxPmoZmuacrM5dBGZ9Jbh5rW3OFtOQDXYyt2RRW41z41HQ4mui5EVzKJyQ/exec"

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repo
      # ---------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # REQUIRED for rebase to work

      # ---------------------------------------------------------
      # 2. Install jq
      # ---------------------------------------------------------
      - name: Install jq
        run: sudo apt-get install -y jq

      # ---------------------------------------------------------
      # 3. Clear old JSON
      # ---------------------------------------------------------
      - name: Clear old JSON
        run: |
          rm -f data/availability.json
          rm -f data/day/*.json
          rm -f data/week/*.json
          rm -f data/month/*.json

      # ---------------------------------------------------------
      # 4. Fetch season window
      # ---------------------------------------------------------
      - name: Fetch season window
        id: season
        run: |
          RAW=$(curl -sSL "$WEBAPP_URL?mode=season_window")

          echo "Fetched season_window:"
          echo "$RAW"

          if ! jq -e . <<<"$RAW" >/dev/null 2>&1; then
            echo "WARNING: Invalid JSON for season_window, replacing with {}"
            RAW="{}"
          fi

          echo "$RAW" > season.json
          echo "season_file=season.json" >> $GITHUB_OUTPUT

      # ---------------------------------------------------------
      # 5. Fetch fields + complexes
      # ---------------------------------------------------------
      - name: Fetch fields + complexes
        id: fields
        run: |
          RAW=$(curl -sSL "$WEBAPP_URL?mode=fields")

          echo "Fetched fields:"
          echo "$RAW"

          if ! jq -e . <<<"$RAW" >/dev/null 2>&1; then
            echo "WARNING: Invalid JSON for fields, replacing with {}"
            RAW="{}"
          fi

          echo "$RAW" > fields.json
          echo "fields_file=fields.json" >> $GITHUB_OUTPUT

      # ---------------------------------------------------------
      # 6. Build day JSON files (handles 90+ days safely)
      # ---------------------------------------------------------
      - name: Build day JSON files
        shell: bash
        run: |
          SEASON_FILE="${{ steps.season.outputs.season_file }}"
          FIELDS_FILE="${{ steps.fields.outputs.fields_file }}"

          START=$(jq -r '.season_start' "$SEASON_FILE")
          END=$(jq -r '.season_end' "$SEASON_FILE")

          mkdir -p data/day data/week data/month

          CURRENT="$START"
          END_PLUS_ONE=$(date -d "$END next day" +%Y-%m-%d)

          echo "Building day JSON from $START to $END"

          while [ "$CURRENT" != "$END_PLUS_ONE" ]; do
            echo "Fetching day: $CURRENT"

            # ⭐ Try up to 3 times
            ATTEMPTS=0
            VALID=false

            while [ $ATTEMPTS -lt 3 ]; do
              RAW=$(curl -sSL "$WEBAPP_URL?mode=day_calendar&date=$CURRENT")

              if jq -e . <<<"$RAW" >/dev/null 2>&1; then
                VALID=true
                break
              fi

              echo "Attempt $((ATTEMPTS+1)) failed for $CURRENT"
              ATTEMPTS=$((ATTEMPTS+1))
              sleep 1
            done

            if [ "$VALID" = false ]; then
              echo "❌ Apps Script returned invalid JSON for $CURRENT — using fallback day"

              # ⭐ Build a safe fallback day JSON
              jq -n \
                --arg date "$CURRENT" \
                --argjson fields "$(cat $FIELDS_FILE)" \
                '{
                  date: $date,
                  complexes: $fields.complexes,
                  fields: $fields.fields,
                  availability: {},
                  events: {},
                  blocks: {},
                  merged: []
                }' > "data/day/${CURRENT}.json"

            else
              echo "$RAW" > day.json

              jq -n \
                --argjson day "$(cat day.json)" \
                --argjson fields "$(cat $FIELDS_FILE)" \
                '{
                  date: $day.date,
                  complexes: $fields.complexes,
                  fields: $fields.fields,
                  availability: ($day.availability // {}),
                  events: ($day.events // {}),
                  blocks: ($day.blocks // {}),
                  merged: ($day.merged // [])
                }' > "data/day/${CURRENT}.json"
            fi

            CURRENT=$(date -d "$CURRENT next day" +%Y-%m-%d)
          done


      # ---------------------------------------------------------
      # 7. Build week + month JSON (no arg-list overflow)
      # ---------------------------------------------------------
      - name: Build week + month JSON
        shell: bash
        run: |
          echo "Building weeks.json..."
          find data/day -name '*.json' -print0 | xargs -0 cat | jq -s '
            map(select(.date | type == "string")) |
            reduce .[] as $d ({}; 
              ($d.date | strptime("%Y-%m-%d") | mktime) as $ts
              | ($ts | strftime("%w") | tonumber) as $w
              | (if $w == 0 then $ts - 6*24*60*60 else $ts - ( $w - 1 )*24*60*60 end) as $mon_ts
              | ($mon_ts | strftime("%Y-%m-%d")) as $monday
              | .[$monday] |= (. // {}) | .[$monday][$d.date] = $d
            )
          ' > data/week/weeks.json

          echo "Building months.json..."
          find data/day -name '*.json' -print0 | xargs -0 cat | jq -s '
            map(select(.date | type == "string")) |
            reduce .[] as $d ({}; 
              .[($d.date | strptime("%Y-%m-%d") | mktime | strftime("%Y-%m"))] 
              |= (. // {}) | .[$d.date] = $d
            )
          ' > data/month/months.json

      # ---------------------------------------------------------
      # 8. Build final availability.json (no arg-list overflow)
      # ---------------------------------------------------------
      - name: Build final availability.json
        shell: bash
        run: |
          SEASON_FILE="${{ steps.season.outputs.season_file }}"
          FIELDS_FILE="${{ steps.fields.outputs.fields_file }}"

          START=$(jq -r '.season_start' "$SEASON_FILE")
          END=$(jq -r '.season_end' "$SEASON_FILE")

          DAYS_JSON=$(find data/day -name '*.json' -print0 | xargs -0 cat | jq -s '
            map(select(.date | type == "string")) |
            reduce .[] as $d ({}; .[$d.date] = $d)
          ')

          jq -n \
            --arg start "$START" \
            --arg end "$END" \
            --argjson fields "$(cat $FIELDS_FILE)" \
            --argjson days "$DAYS_JSON" \
            --argjson weeks "$(cat data/week/weeks.json)" \
            --argjson months "$(cat data/month/months.json)" \
            '{
              season_start: $start,
              season_end: $end,
              fields: $fields.fields,
              complexes: $fields.complexes,
              days: $days,
              weeks: $weeks,
              months: $months
            }' > data/availability.json

      # ---------------------------------------------------------
      # 9. Commit + safe rebase + push
      # ---------------------------------------------------------
      - name: Commit updated JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "Updated availability JSON" || true

          git pull --rebase origin main || true
          git push origin main
