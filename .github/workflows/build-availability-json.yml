name: Build Availability JSON

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WEBAPP_URL: "https://script.google.com/macros/s/AKfycbz3dMJtYEYxPmoZmuacrM5dBGZ9Jbh5rW3OFtOQDXYyt2RRW41z41HQ4mui5EVzKJyQ/exec"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get install -y jq

      # ---------------------------------------------------------
      # Ensure directories exist
      # ---------------------------------------------------------
      - name: Ensure directories exist
        run: |
          mkdir -p data/day data/week data/month

      # ---------------------------------------------------------
      # Fetch season window
      # ---------------------------------------------------------
      - name: Fetch season window
        id: season
        run: |
          RAW=$(curl -sSL "$WEBAPP_URL?mode=season_window")
          if ! jq -e . <<<"$RAW" >/dev/null 2>&1; then RAW="{}"; fi
          echo "$RAW" > season.json
          echo "season_file=season.json" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Fetch fields + complexes
      # ---------------------------------------------------------
      - name: Fetch fields + complexes
        id: fields
        run: |
          RAW=$(curl -sSL "$WEBAPP_URL?mode=fields")
          if ! jq -e . <<<"$RAW" >/dev/null 2>&1; then RAW="{}"; fi
          echo "$RAW" > fields.json
          echo "fields_file=fields.json" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Build day JSON files
      # ---------------------------------------------------------
      - name: Build day JSON files
        shell: bash
        run: |
          SEASON_FILE="${{ steps.season.outputs.season_file }}"
          FIELDS_FILE="${{ steps.fields.outputs.fields_file }}"

          START=$(jq -r '.season_start' "$SEASON_FILE")
          END=$(jq -r '.season_end' "$SEASON_FILE")

          CURRENT="$START"
          END_PLUS_ONE=$(date -d "$END next day" +%Y-%m-%d)

          FULL_AVAIL=$(jq -n --argjson fields "$(cat "$FIELDS_FILE")" '
            def fullRange: [{start:"08:00", end:"21:00"}];
            reduce $fields.fields[] as $f ({}; .[$f.id] = fullRange)
          ')

          while [ "$CURRENT" != "$END_PLUS_ONE" ]; do
            echo "Fetching day: $CURRENT"

            RAW=$(curl -sSL "$WEBAPP_URL?mode=day_calendar&date=$CURRENT")

            export TZ="America/New_York"
            TS_HUMAN=$(date +"%B %d, %Y at %-I:%M %p")

            if jq -e . <<<"$RAW" >/dev/null 2>&1; then
              echo "$RAW" > day_raw.json

              jq -n \
                --argjson day "$(cat day_raw.json)" \
                --argjson fields "$(cat "$FIELDS_FILE")" \
                --arg ts "$TS_HUMAN" \
                '{
                  date: $day.date,
                  updated: true,
                  last_successful_update: $ts,
                  complexes: $fields.complexes,
                  fields: $fields.fields,
                  availability: ($day.availability // {}),
                  events: ($day.events // {}),
                  blocks: ($day.blocks // {}),
                  merged: ($day.merged // []),
                  merged_availability: ($day.merged_availability // {})
                }' > "data/day/${CURRENT}.json"

            else
              jq -n \
                --arg date "$CURRENT" \
                --argjson fields "$(cat "$FIELDS_FILE")" \
                --argjson fullAvail "$FULL_AVAIL" \
                --arg ts "$TS_HUMAN" \
                '{
                  date: $date,
                  updated: false,
                  last_successful_update: $ts,
                  complexes: $fields.complexes,
                  fields: $fields.fields,
                  availability: $fullAvail,
                  events: {},
                  blocks: {},
                  merged: [],
                  merged_availability: {}
                }' > "data/day/${CURRENT}.json"
            fi

            CURRENT=$(date -d "$CURRENT next day" +%Y-%m-%d)
          done

      # ---------------------------------------------------------
      # Build week + month JSON (streaming, no glob args)
      # ---------------------------------------------------------
      - name: Build week + month JSON
        shell: bash
        continue-on-error: true
        run: |
          echo "Building weeks.json..."
          if find data/day -name '*.json' | grep -q .; then
            find data/day -name '*.json' -exec cat {} \; | jq -s '
              map(select(.date | type == "string")) |
              reduce .[] as $d ({}; 
                ($d.date | strptime("%Y-%m-%d") | mktime) as $ts
                | ($ts | strftime("%w") | tonumber) as $w
                | (if $w == 0 then $ts - 6*24*60*60 else $ts - ( $w - 1 )*24*60*60 end) as $mon_ts
                | ($mon_ts | strftime("%Y-%m-%d")) as $monday
                | .[$monday] |= (. // {}) | .[$monday][$d.date] = $d
              )
            ' > data/week/weeks.json || echo "{}" > data/week/weeks.json
          else
            echo "{}" > data/week/weeks.json
          fi

          echo "Building months.json..."
          if find data/day -name '*.json' | grep -q .; then
            find data/day -name '*.json' -exec cat {} \; | jq -s '
              map(select(.date | type == "string")) |
              reduce .[] as $d ({}; 
                .[($d.date | strptime("%Y-%m-%d") | mktime | strftime("%Y-%m"))] 
                |= (. // {}) | .[$d.date] = $d
              )
            ' > data/month/months.json || echo "{}" > data/month/months.json
          else
            echo "{}" > data/month/months.json
          fi

      # ---------------------------------------------------------
      # Build final availability.json (streaming days)
      # ---------------------------------------------------------
      - name: Build final availability.json
        shell: bash
        continue-on-error: true
        run: |
          SEASON_FILE="${{ steps.season.outputs.season_file }}"
          FIELDS_FILE="${{ steps.fields.outputs.fields_file }}"

          START=$(jq -r '.season_start' "$SEASON_FILE")
          END=$(jq -r '.season_end' "$SEASON_FILE")

          if find data/day -name '*.json' | grep -q .; then
            DAYS_JSON=$(find data/day -name '*.json' -exec cat {} \; | jq -s '
              map(select(.date | type == "string")) |
              reduce .[] as $d ({}; .[$d.date] = $d)
            ')
          else
            DAYS_JSON="{}"
          fi

          jq -n \
            --arg start "$START" \
            --arg end "$END" \
            --argjson fields "$(cat "$FIELDS_FILE")" \
            --argjson days "$DAYS_JSON" \
            --argjson weeks "$(cat data/week/weeks.json)" \
            --argjson months "$(cat data/month/months.json)" \
            '{
              season_start: $start,
              season_end: $end,
              fields: $fields.fields,
              complexes: $fields.complexes,
              days: $days,
              weeks: $weeks,
              months: $months
            }' > data/availability.json

      # ---------------------------------------------------------
      # Write global last_updated.json
      # ---------------------------------------------------------
      - name: Write last_updated.json
        run: |
          export TZ="America/New_York"
          TS_HUMAN=$(date +"%B %d, %Y at %-I:%M %p")
          jq -n --arg ts "$TS_HUMAN" '{ last_successful_update: $ts }' \
            > data/last_updated.json

      # ---------------------------------------------------------
      # Commit updated JSON
      # ---------------------------------------------------------
      - name: Commit updated JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
      
          # Always pull the latest main BEFORE committing
          git pull --rebase --autostash origin main || true
      
          git add -A
          git commit -m "Updated availability JSON" || true
          git push origin main
