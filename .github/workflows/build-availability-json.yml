name: Build Availability JSON

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WEBAPP_URL: "https://script.google.com/macros/s/AKfycbz3dMJtYEYxPmoZmuacrM5dBGZ9Jbh5rW3OFtOQDXYyt2RRW41z41HQ4mui5EVzKJyQ/exec"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch season window
        id: season
        run: |
          echo "🔎 Fetching season window..."

          for i in {1..5}; do
            RAW=$(curl -sSL "$WEBAPP_URL?mode=season_window") && break
            echo "Retry $i..."
            sleep $((i * 2))
          done

          # ⭐ FIXED — no backticks
          CLEAN=$(echo "$RAW" | sed -n 's/.*<pre>`\(.*\)`<\/pre>.*/\1/p')
          if [ -z "$CLEAN" ]; then CLEAN="$RAW"; fi

          echo "Season window raw: $RAW"
          echo "Season window clean: $CLEAN"

          if ! echo "$CLEAN" | jq empty >/dev/null 2>&1; then
            echo "❌ Season window JSON invalid"
            exit 1
          fi

          START=$(echo "$CLEAN" | jq -r '.season_start')
          END=$(echo "$CLEAN" | jq -r '.season_end')

          START=$(date -d "$START" +%Y-%m-%d)
          END=$(date -d "$END" +%Y-%m-%d)

          echo "season_start=$START" >> $GITHUB_OUTPUT
          echo "season_end=$END" >> $GITHUB_OUTPUT

      - name: Build availability + search index
        run: |
          START="${{ steps.season.outputs.season_start }}"
          END="${{ steps.season.outputs.season_end }}"

          mkdir -p data/tmp_days data/tmp_search

          for i in {1..5}; do
            FIELDS_RAW=$(curl -sSL "$WEBAPP_URL?mode=fields") && break
            sleep $((i * 2))
          done

          # ⭐ FIXED — no backticks
          FIELDS_CLEAN=$(echo "$FIELDS_RAW" | sed -n 's/.*<pre>`\(.*\)`<\/pre>.*/\1/p')
          if [ -z "$FIELDS_CLEAN" ]; then FIELDS_CLEAN="$FIELDS_RAW"; fi

          if ! echo "$FIELDS_CLEAN" | jq empty >/dev/null 2>&1; then
            exit 1
          fi

          CURRENT="$START"

          while [ "$(date -d "$CURRENT" +%Y-%m-%d)" != "$(date -d "$END + 1 day" +%Y-%m-%d)" ]; do

            for i in {1..5}; do
              RAW_DAY=$(curl -sSL "$WEBAPP_URL?mode=day_calendar&date=$CURRENT") && break
              sleep $((i * 2))
            done

            # ⭐ FIXED — no backticks
            CLEAN_DAY=$(echo "$RAW_DAY" | sed -n 's/.*<pre>`\(.*\)`<\/pre>.*/\1/p')
            if [ -z "$CLEAN_DAY" ]; then CLEAN_DAY="$RAW_DAY"; fi

            if ! echo "$CLEAN_DAY" | jq empty >/dev/null 2>&1; then
              exit 1
            fi

            echo "$CLEAN_DAY" > "data/tmp_days/${CURRENT}.json"

            COMPLEXES=$(echo "$CLEAN_DAY" | jq -r '.complex_timeline | keys[]')

            DAY_SEARCH="{}"

            for CX in $COMPLEXES; do
              WINDOWS=$(echo "$CLEAN_DAY" | jq --arg cx "$CX" '.complex_timeline[$cx]')
              DAY_SEARCH=$(echo "$DAY_SEARCH" | jq --arg cx "$CX" --argjson w "$WINDOWS" '.[$cx] = $w')
            done

            echo "$DAY_SEARCH" > "data/tmp_search/${CURRENT}.json"

            CURRENT=$(date -d "$CURRENT + 1 day" +%Y-%m-%d)
          done

          DAYS_JSON=$(jq -s 'reduce .[] as $d ({}; .[$d.date] = $d)' data/tmp_days/*.json)

          WEEKS_JSON=$(jq -s '
            reduce .[] as $d ({}; 
              .[(($d.date | strptime("%Y-%m-%d") | mktime | strftime("%Y")) 
                + "-W" + 
                ($d.date | strptime("%Y-%m-%d") | mktime | strftime("%U")))] 
              |= (. // {}) | .[$d.date] = $d
            )
          ' data/tmp_days/*.json)

          MONTHS_JSON=$(jq -s '
            reduce .[] as $d ({}; 
              .[($d.date | strptime("%Y-%m-%d") | mktime | strftime("%Y-%m"))] 
              |= (. // {}) | .[$d.date] = $d
            )
          ' data/tmp_days/*.json)

          SEARCH_JSON="{}"
          for f in data/tmp_search/*.json; do
            d=$(basename "$f" .json)
            s=$(cat "$f")
            SEARCH_JSON=$(echo "$SEARCH_JSON" | jq --arg d "$d" --argjson v "$s" '.[$d] = $v')
          done

          FINAL_JSON=$(jq -n \
            --arg start "$START" \
            --arg end "$END" \
            --argjson fields "$FIELDS_CLEAN" \
            --argjson days "$DAYS_JSON" \
            --argjson weeks "$WEEKS_JSON" \
            --argjson months "$MONTHS_JSON" \
            '{
              season_start: $start,
              season_end: $end,
              fields: $fields.fields,
              complexes: $fields.complexes,
              days: $days,
              weeks: $weeks,
              months: $months
            }'
          )

          echo "$FINAL_JSON"  > data/availability.json
          echo "$SEARCH_JSON" > data/search_index.json

      - name: Commit updated JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add data
          git commit -m "Updated availability + search index" || echo "No changes"
          git push
