<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAYSA Calendar</title>
  <link rel="stylesheet" href="calendar.css?v=1">
</head>
<body>

  <header class="app-header">
    <div class="app-header-inner">
      <h1 class="app-title">HAYSA Calendar</h1>

      <nav class="nav">
        <button onclick="showDay(selectedDate)">Day</button>
        <button onclick="showWeek(selectedDate)">Week</button>
        <button onclick="showMonth(selectedDate)">Month</button>

        <!-- Optional search buttons -->
        <button onclick="searchSaturdaysAfter2()">Sat After 2</button>
        <button onclick="searchWeekdaysAfter7()">Weekdays After 7</button>
      </nav>
    </div>

    <div id="lastUpdated" class="last-updated"></div>
  </header>

  <!-- REQUIRED: this is where the calendar renders -->
  <main id="calendar"></main>

  <script>
    // Default selected date (you can change this later)
    let selectedDate = "2026-10-17";

    document.addEventListener("DOMContentLoaded", () => {
      showDay(selectedDate);
    });
  </script>

  <script src="calendar.js?v=1"></script>
</body>
</html>
