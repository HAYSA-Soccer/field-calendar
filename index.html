<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAYSA Calendar</title>
  <link rel="stylesheet" href="calendar.css">
</head>

<body>

  <h1>HAYSA Calendar</h1>

  <!-- Legend -->
  <div id="legend">
    <div class="legend-item">
      <span class="legend-color practice"></span> Practice
    </div>
    <div class="legend-item">
      <span class="legend-color game"></span> Game
    </div>
    <div class="legend-item">
      <span class="legend-color available"></span> Available
    </div>
    <div class="legend-item">
      <span class="legend-color conflict"></span> Conflict
    </div>
  </div>

  <!-- Filters -->
  <div id="filters">
    <label><input type="checkbox" id="filter-practice" checked> Practice</label>
    <label><input type="checkbox" id="filter-game" checked> Game</label>
    <label><input type="checkbox" id="filter-available" checked> Availability</label>
  </div>

  <!-- Day label -->
  <div id="day-label"></div>

  <!-- Date Picker -->
  <div id="date-picker">
    <label for="calendar-date">Select Date:</label>
    <input type="date" id="calendar-date">
    <button id="load-date" class="nav-btn">Go</button>
  </div>

  <!-- Navigation Buttons -->
  <div id="nav-buttons">
    <button id="prev-day" class="nav-btn">← Previous Day</button>
    <button id="today" class="nav-btn">Today</button>
    <button id="next-day" class="nav-btn">Next Day →</button>
  </div>

  <div id="calendar"></div>

  <script src="calendar.js"></script>
  <script>
    const dateInput = document.getElementById("calendar-date");
    const todayStr = new Date().toISOString().split("T")[0];
    dateInput.value = todayStr;
    updateDayLabel(todayStr);
    loadDay(todayStr);

    document.getElementById("load-date").addEventListener("click", () => {
      const d = dateInput.value;
      updateDayLabel(d);
      loadDay(d);
    });

    document.getElementById("prev-day").addEventListener("click", () => {
      const d = new Date(dateInput.value);
      d.setDate(d.getDate() - 1);
      const newDate = d.toISOString().split("T")[0];
      dateInput.value = newDate;
      updateDayLabel(newDate);
      loadDay(newDate);
    });

    document.getElementById("next-day").addEventListener("click", () => {
      const d = new Date(dateInput.value);
      d.setDate(d.getDate() + 1);
      const newDate = d.toISOString().split("T")[0];
      dateInput.value = newDate;
      updateDayLabel(newDate);
      loadDay(newDate);
    });

    document.getElementById("today").addEventListener("click", () => {
      const today = new Date().toISOString().split("T")[0];
      dateInput.value = today;
      updateDayLabel(today);
      loadDay(today);
    });

    ["filter-practice", "filter-game", "filter-available"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => {
        const d = dateInput.value;
        updateDayLabel(d);
        loadDay(d);
      });
    });
  </script>

</body>
</html>
