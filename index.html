<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAYSA Calendar</title>
  <link rel="stylesheet" href="calendar.css">
</head>

<body>

  <div class="page-header">

    <h1>HAYSA Calendar</h1>

    <div id="global-refresh-banner"
         class="global-refresh-banner">
    </div>

    <div id="legend">

      <div class="legend-item">
        <span class="legend-color practice"></span>
        <span>Practice</span>
      </div>

      <div class="legend-item">
        <span class="legend-color game"></span>
        <span>Game</span>
      </div>

      <div class="legend-item">
        <span class="legend-color available"></span>
        <span>Available</span>
      </div>

      <div class="legend-item">
        <span class="legend-sunset"></span>
        <span>Sunset</span>
      </div>

    </div>

  </div>

  <div class="calendar-toolbar">

    <div class="toolbar-section">

      <div class="toolbar-label">
        Date
      </div>

      <input
        type="date"
        id="calendar-date"
        class="calendar-date-input">

    </div>

    <div class="toolbar-section">

      <div class="toolbar-label">
        Complexes
      </div>

      <div id="complex-buttons"
           class="complex-buttons">
      </div>

    </div>

  </div>

  <div id="nav-buttons"
       class="day-nav">

    <button id="prev-day">
      ← Previous
    </button>

    <button id="today">
      Today
    </button>

    <button id="next-day">
      Next →
    </button>

  </div>

  <div id="view-toggle"
       class="view-toggle">

    <button id="toggle-daily">
      Daily View
    </button>

    <button id="toggle-weekly">
      Weekly View
    </button>

  </div>

  <div id="day-label"
       class="day-label">
  </div>

  <div id="day-note"></div>

  <div id="calendar"></div>

  <div id="week-label"
       class="week-label">
  </div>

  <div id="weekly-view"></div>

  <script src="calendar_v2.js?v=20261024"></script>

</body>
</html>
