<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAYSA Calendar</title>
  <link rel="stylesheet" href="calendar.css">
</head>

<body>

  <h1>HAYSA Calendar</h1>

  <div id="global-refresh-banner" class="global-refresh-banner"></div>

  <!-- LEGEND -->
  <div id="legend">
    <div class="legend-item">
      <span class="legend-color practice"></span> Practice
    </div>
    <div class="legend-item">
      <span class="legend-color game"></span> Game
    </div>
    <div class="legend-item">
      <span class="legend-color available"></span> Available
    </div>
  </div>

  <!-- DATE PICKER -->
  <div id="date-picker" class="date-picker">
    <label for="calendar-date">Select Date:</label>
    <input type="date" id="calendar-date">
    <button id="load-date" class="day-nav-btn">Go</button>
  </div>

  <!-- VIEW TOGGLE (Daily / Weekly) -->
  <div id="view-toggle" class="view-toggle">
    <button id="toggle-daily">Daily View</button>
    <button id="toggle-weekly">Weekly View</button>
  </div>

  <!-- COMPLEX FILTER (Weekly Only) -->
  <div id="weekly-controls" class="weekly-controls" style="margin-top:20px;">
    <label style="font-weight:600;">Filter Complexes:</label>
    <select id="complex-filter" class="complex-filter" multiple size="4">
      <!-- Populated dynamically -->
    </select>
  </div>

  <!-- DAILY LABEL -->
  <div id="day-label" class="day-label" style="font-size:18px; font-weight:600; margin-bottom:10px;"></div>
  <div id="day-note"></div>

  <!-- DAILY VIEW -->
  <div id="calendar"></div>

  <!-- WEEKLY VIEW -->
  <div id="weekly-view"></div>

  <!-- JS -->
  <script src="calendar_v2.js?v=20261024"></script>

</body>
</html>
