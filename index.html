<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAYSA Calendar</title>
  <link rel="stylesheet" href="calendar.css">
</head>

<body>

  <h1>HAYSA Calendar</h1>

  <div id="global-refresh-banner" class="global-refresh-banner"></div>

  <!-- LEGEND -->
  <div id="legend">
    <div class="legend-item">
      <span class="legend-color practice"></span> Practice
    </div>
    <div class="legend-item">
      <span class="legend-color game"></span> Game
    </div>
    <div class="legend-item">
      <span class="legend-color available"></span> Available
    </div>
    <div class="legend-item">
      <span class="legend-color game-only"></span> Available (Game Only)
    </div>
    <div class="legend-item">
      <span class="legend-color practice-only"></span> Available (Practice Only)
    </div>
  </div>

  <!-- DATE PICKER -->
  <div id="date-picker" class="date-picker">
    <label for="calendar-date">Select Date:</label>
    <input type="date" id="calendar-date">
    <button id="load-date" class="day-nav-btn">Go</button>
  </div>

  <!-- ⭐ BIG NAV BUTTONS -->
  <div id="nav-buttons" class="day-nav">
    <button id="prev-day" class="day-nav-btn">← Previous Day</button>
    <button id="today" class="day-nav-btn">Today</button>
    <button id="next-day" class="day-nav-btn">Next Day →</button>
  </div>

  <!-- ⭐ WEEKLY VIEW CONTROLS -->
  <div id="weekly-controls" class="weekly-controls" style="margin-top:20px;">
    <button id="show-week" class="day-nav-btn">Weekly View</button>

    <select id="complex-filter" class="complex-filter">
      <option value="all">All Complexes</option>
      <option value="Butler">Butler</option>
      <option value="Brookville">Brookville</option>
      <option value="Sumner/SE">Sumner/SE</option>
      <option value="Turf">Turf</option>
    </select>
  </div>

  <!-- DAILY LABEL -->
  <div id="day-label" class="day-label" style="font-size:18px; font-weight:600; margin-bottom:10px;"></div>
  <div id="day-note"></div>

  <!-- DAILY VIEW -->
  <div id="calendar"></div>

  <!-- WEEKLY VIEW -->
  <div id="weekly-view" class="weekly-view"></div>

  <!-- IMPORTANT: bump version to force reload -->
  <script src="calendar_v2.js?v=20261024"></script>

  <script>
    loadGlobalRefreshBanner();

    const dateInput = document.getElementById("calendar-date");
    const todayStr = new Date().toISOString().split("T")[0];
    dateInput.value = todayStr;

    updateDayLabel(todayStr);
    loadDay(todayStr);

    document.getElementById("load-date").addEventListener("click", () => {
      const d = dateInput.value;
      if (d) {
        updateDayLabel(d);
        loadDay(d);
      }
    });

    document.getElementById("prev-day").addEventListener("click", () => {
      const d = new Date(dateInput.value);
      d.setDate(d.getDate() - 1);
      const newDate = d.toISOString().split("T")[0];
      dateInput.value = newDate;
      updateDayLabel(newDate);
      loadDay(newDate);
    });

    document.getElementById("next-day").addEventListener("click", () => {
      const d = new Date(dateInput.value);
      d.setDate(d.getDate() + 1);
      const newDate = d.toISOString().split("T")[0];
      dateInput.value = newDate;
      updateDayLabel(newDate);
      loadDay(newDate);
    });

    document.getElementById("today").addEventListener("click", () => {
      const today = new Date().toISOString().split("T")[0];
      dateInput.value = today;
      updateDayLabel(today);
      loadDay(today);
    });

    /* ⭐ WEEKLY VIEW HOOKS (JS logic added later) */
    document.getElementById("show-week").addEventListener("click", () => {
      const d = dateInput.value;
      loadWeek(d);
    });

    document.getElementById("complex-filter").addEventListener("change", () => {
      const d = dateInput.value;
      loadWeek(d);
    });
  </script>

</body>
</html>
