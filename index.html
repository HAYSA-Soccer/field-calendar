<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAYSA Calendar</title>
  <link rel="stylesheet" href="calendar.css">
</head>

<body>

  <h1>HAYSA Calendar</h1>

  <!-- Date Picker -->
  <div id="date-picker">
    <label for="calendar-date">Select Date:</label>
    <input type="date" id="calendar-date">
    <button id="load-date">Go</button>
  </div>

  <!-- Calendar Container -->
  <div id="calendar"></div>

  <script src="calendar.js"></script>

  <script>
    // Load today's date on page load
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("calendar-date").value = today;
    loadDay(today);

    // Date picker button
    document.getElementById("load-date").addEventListener("click", () => {
      const date = document.getElementById("calendar-date").value;
      if (date) loadDay(date);
    });
  </script>

</body>
</html>
