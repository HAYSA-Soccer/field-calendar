<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAYSA Calendar</title>
  <link rel="stylesheet" href="calendar.css?v=3">
</head>

<body onload="initCalendar()">

  <header class="app-header">
    <div class="app-header-inner">
      <h1 class="app-title">HAYSA Calendar</h1>

      <nav class="nav">
        <button onclick="showDay(currentDate)">Day</button>
        <button onclick="showWeek(currentDate)">Week</button>
        <button onclick="showMonth(currentDate)">Month</button>

        <button onclick="changeDay(-1)">← Previous</button>
        <button onclick="initCalendar()">Today</button>
        <button onclick="changeDay(1)">Next →</button>
      </nav>
    </div>

    <div id="lastUpdated" class="last-updated"></div>
  </header>

  <!-- LEGEND + CALENDAR -->
  <main id="calendar-wrapper">
    <div id="calendar-legend"></div>
    <div id="calendar"></div>
  </main>

  <script src="calendar.js?v=3"></script>
</body>
</html>
